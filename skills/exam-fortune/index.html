<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考试运程预测 · 周易卦象</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --vermilion: #B22222;
  --vermilion-light: #DC143C;
  --gold: #C9A84C;
  --gold-light: #FFD700;
  --ink: #1a1a1a;
  --ink-light: #2d2d2d;
  --parchment: #F5E6C8;
  --parchment-dark: #E8D5A3;
  --paper-bg: #FFF8E7;
  --shadow: rgba(0,0,0,0.3);
}
body {
  font-family: 'Noto Serif SC', 'ZCOOL XiaoWei', serif;
  background: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background-image: 
    radial-gradient(ellipse at 20% 50%, rgba(178,34,34,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(201,168,76,0.06) 0%, transparent 50%);
}
.container {
  width: 100%;
  max-width: 580px;
  position: relative;
}
.scroll-frame {
  background: var(--paper-bg);
  border-radius: 4px;
  padding: 40px 35px;
  position: relative;
  box-shadow: 
    0 0 0 1px var(--gold),
    0 0 0 3px var(--ink-light),
    0 0 0 4px var(--gold),
    0 20px 60px rgba(0,0,0,0.5);
  overflow: hidden;
}
.scroll-frame::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.03) 40px,
    rgba(201,168,76,0.03) 41px
  );
  pointer-events: none;
}
/* Decorative top/bottom bars */
.scroll-bar {
  height: 12px;
  background: linear-gradient(90deg, var(--vermilion), var(--gold), var(--vermilion));
  border-radius: 2px;
  margin: 0 -10px;
  opacity: 0.8;
}
.scroll-bar-bottom {
  margin-top: 30px;
}
/* Header */
.header {
  text-align: center;
  margin-bottom: 30px;
}
.header-icon {
  font-size: 28px;
  color: var(--gold);
  margin-bottom: 8px;
}
h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 2.2rem;
  color: var(--vermilion);
  letter-spacing: 6px;
  text-shadow: 1px 1px 2px rgba(178,34,34,0.2);
}
.subtitle {
  font-size: 0.85rem;
  color: var(--ink-light);
  opacity: 0.6;
  margin-top: 4px;
  letter-spacing: 3px;
}
/* Divider */
.divider {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px 0;
}
/* Input group */
.input-group {
  margin-bottom: 18px;
}
.input-group label {
  display: block;
  font-size: 0.9rem;
  color: var(--ink-light);
  margin-bottom: 6px;
  font-weight: 700;
}
.input-group label .optional {
  font-weight: 400;
  opacity: 0.5;
  font-size: 0.8rem;
}
.input-wrapper {
  position: relative;
}
.input-wrapper i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 1rem;
}
.input-wrapper input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 1px solid var(--parchment-dark);
  border-radius: 4px;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem;
  background: white;
  color: var(--ink);
  transition: all 0.3s;
  outline: none;
}
.input-wrapper input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
}
.input-wrapper input::placeholder {
  color: #bbb;
  font-size: 0.85rem;
}
/* Button */
.btn-divination {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--vermilion), #8B0000);
  color: var(--gold);
  border: 2px solid var(--gold);
  border-radius: 4px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.5rem;
  letter-spacing: 8px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  margin: 24px 0 10px;
}
.btn-divination:hover:not(:disabled) {
  background: linear-gradient(135deg, #CC0000, var(--vermilion));
  box-shadow: 0 0 20px rgba(178,34,34,0.3);
  transform: translateY(-1px);
}
.btn-divination:active:not(:disabled) {
  transform: translateY(0);
}
.btn-divination:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.btn-divination i {
  margin-right: 6px;
}
/* Shake animation */
@keyframes shake-coin {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  10% { transform: translate(-3px, -2px) rotate(-2deg); }
  20% { transform: translate(3px, -1px) rotate(2deg); }
  30% { transform: translate(-2px, 2px) rotate(-1deg); }
  40% { transform: translate(2px, 1px) rotate(1deg); }
  50% { transform: translate(-4px, -1px) rotate(-3deg); }
  60% { transform: translate(3px, 2px) rotate(2deg); }
  70% { transform: translate(-1px, -2px) rotate(-1deg); }
  80% { transform: translate(2px, -1px) rotate(1deg); }
  90% { transform: translate(-3px, 1px) rotate(-2deg); }
}
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 5px rgba(201,168,76,0.3), 0 0 10px rgba(201,168,76,0.1); }
  50% { box-shadow: 0 0 20px rgba(201,168,76,0.6), 0 0 40px rgba(201,168,76,0.2); }
}
.shaking {
  animation: shake-coin 0.6s ease-in-out 3;
}
.shaking-glow {
  animation: glow-pulse 0.6s ease-in-out 3;
}
/* Loading overlay */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.loading-overlay.active {
  display: flex;
}
.loading-coin {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, var(--gold-light), var(--gold), #8B7355);
  border: 3px solid #8B7355;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: var(--vermilion);
  animation: shake-coin 0.4s ease-in-out infinite;
  box-shadow: 0 0 30px rgba(201,168,76,0.4);
}
.loading-text {
  color: var(--gold-light);
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.3rem;
  margin-top: 20px;
  letter-spacing: 4px;
  animation: pulse-text 1.5s ease-in-out infinite;
}
@keyframes pulse-text {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
/* Result area */
.result-area {
  display: none;
  margin-top: 10px;
  animation: fadeInUp 0.8s ease-out;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-area.visible {
  display: block;
}
/* Hexagram display */
.hexagram-display {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, rgba(201,168,76,0.05), rgba(178,34,34,0.05));
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 4px;
  margin-bottom: 20px;
  position: relative;
}
.hexagram-symbol {
  font-size: 3.5rem;
  font-family: 'Ma Shan Zheng', cursive;
  color: var(--vermilion);
  line-height: 1;
  margin-bottom: 8px;
}
.hexagram-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 2rem;
  color: var(--ink);
  letter-spacing: 4px;
}
.hexagram-sub {
  font-size: 0.9rem;
  color: var(--ink-light);
  opacity: 0.7;
  margin-top: 4px;
}
/* Yao lines visualization */
.yao-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin: 15px 0;
  padding: 10px;
}
.yao-line {
  display: flex;
  align-items: center;
  gap: 4px;
}
.yao-line .line {
  display: block;
  height: 4px;
  border-radius: 2px;
}
.yao-line .line-solid {
  width: 60px;
  background: var(--ink);
}
.yao-line .line-broken {
  width: 60px;
  background: transparent;
  border-top: 4px dashed var(--ink);
  height: 4px;
}
.yao-label {
  font-size: 0.7rem;
  color: #999;
  width: 20px;
  text-align: right;
}
/* Score gauge */
.score-section {
  text-align: center;
  padding: 15px;
  border-top: 1px solid rgba(201,168,76,0.3);
  border-bottom: 1px solid rgba(201,168,76,0.3);
  margin: 15px 0;
}
.score-label {
  font-size: 0.85rem;
  color: var(--ink-light);
  opacity: 0.6;
}
.score-number {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 3rem;
  line-height: 1;
  margin: 5px 0;
}
.score-bar-bg {
  width: 100%;
  height: 6px;
  background: #eee;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 8px;
}
.score-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1.5s ease-out;
}
/* Interpretation text */
.interpretation {
  padding: 15px 0;
}
.interpretation h3 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1.2rem;
  color: var(--vermilion);
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.interpretation p {
  font-size: 0.92rem;
  line-height: 1.8;
  color: var(--ink-light);
  text-align: justify;
}
.interpretation .oracle {
  font-style: italic;
  color: var(--vermilion);
  background: rgba(178,34,34,0.05);
  padding: 10px 15px;
  border-left: 3px solid var(--gold);
  margin: 10px 0;
  border-radius: 0 4px 4px 0;
}
.advice-box {
  background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(178,34,34,0.05));
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 4px;
  padding: 15px;
  margin: 15px 0;
}
.advice-box h4 {
  font-family: 'Ma Shan Zheng', cursive;
  color: var(--vermilion);
  font-size: 1rem;
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.advice-box p {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--ink-light);
}
/* Share buttons */
.share-section {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: center;
}
.share-btn {
  padding: 10px 20px;
  border: 1px solid var(--gold);
  border-radius: 4px;
  background: white;
  color: var(--ink-light);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.share-btn:hover {
  background: var(--gold);
  color: white;
  border-color: var(--gold);
}
.share-btn i {
  font-size: 0.9rem;
}
/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--gold);
  padding: 12px 24px;
  border-radius: 4px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.4s;
  z-index: 2000;
  border: 1px solid var(--gold);
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
/* Footer */
.footer {
  text-align: center;
  padding-top: 20px;
  margin-top: 10px;
}
.footer p {
  font-size: 0.75rem;
  color: var(--ink-light);
  opacity: 0.5;
  letter-spacing: 1px;
  line-height: 1.8;
}
.footer .brand {
  color: var(--vermilion);
  opacity: 0.7;
  font-weight: 700;
  letter-spacing: 2px;
}
/* Responsive */
@media (max-width: 600px) {
  .scroll-frame { padding: 25px 20px; }
  h1 { font-size: 1.8rem; letter-spacing: 4px; }
  .hexagram-name { font-size: 1.6rem; }
  .score-number { font-size: 2.5rem; }
  .share-section { flex-direction: column; }
  .share-btn { justify-content: center; }
}
</style>
</head>
<body>
<div class="container">
  <div class="scroll-bar"></div>
  <div class="scroll-frame">
    <!-- Header -->
    <div class="header">
      <div class="header-icon"><i class="fa-solid fa-hill-rockslide"></i></div>
      <h1>考试运程预测</h1>
      <p class="subtitle">— 周易古法 · 诚心起卦 —</p>
    </div>
    <hr class="divider">
    
    <!-- Input Form -->
    <form id="fortuneForm">
      <div class="input-group">
        <label>📚 考试科目 <span class="optional">（必填）</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-pen-fancy"></i>
          <input type="text" id="subject" placeholder="如：高等数学、大学英语、考研政治…" required>
        </div>
      </div>
      <div class="input-group">
        <label>📅 考试日期 <span class="optional">（必填）</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-calendar-days"></i>
          <input type="date" id="examDate">
        </div>
      </div>
      <div class="input-group">
        <label>🧑 你的名字 <span class="optional">（选填）</span></label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="userName" placeholder="输入姓名可加持运势…">
        </div>
      </div>
      <button type="submit" class="btn-divination" id="divineBtn">
        <i class="fa-solid fa-coins"></i> 起 卦
      </button>
    </form>

    <!-- Result Area -->
    <div class="result-area" id="resultArea">
      <hr class="divider">
      
      <!-- Hexagram Display -->
      <div class="hexagram-display" id="hexagramDisplay">
        <div class="hexagram-symbol" id="hexagramSymbol"></div>
        <div class="hexagram-name" id="hexagramName"></div>
        <div class="hexagram-sub" id="hexagramSub"></div>
        <!-- Yao lines -->
        <div class="yao-container" id="yaoContainer"></div>
      </div>

      <!-- Oracle -->
      <div class="interpretation">
        <h3><i class="fa-solid fa-quote-left" style="font-size:0.8rem;opacity:0.5;"></i> 卦辞</h3>
        <div class="oracle" id="oracleText"></div>
      </div>

      <!-- Score -->
      <div class="score-section">
        <div class="score-label">吉凶指数</div>
        <div class="score-number" id="scoreNumber"></div>
        <div class="score-bar-bg">
          <div class="score-bar-fill" id="scoreBarFill"></div>
        </div>
      </div>

      <!-- Interpretation -->
      <div class="interpretation">
        <h3><i class="fa-solid fa-compass"></i> 考试运程解读</h3>
        <p id="interpretationText"></p>
      </div>

      <!-- Advice -->
      <div class="advice-box">
        <h4><i class="fa-solid fa-lightbulb"></i> 密心建议</h4>
        <p id="adviceText"></p>
      </div>

      <!-- Share -->
      <div class="share-section">
        <button class="share-btn" id="copyLinkBtn"><i class="fa-regular fa-copy"></i> 复制结果</button>
        <button class="share-btn" id="screenshotBtn"><i class="fa-regular fa-image"></i> 保存截图</button>
      </div>
    </div>

    <!-- Footer -->
    <hr class="divider">
    <div class="footer">
      <p>🎯 仅供娱乐 · 好好学习才是正道</p>
      <p class="brand">— 密心(Meseeing) · knowledge-juice</p>
    </div>
  </div>
  <div class="scroll-bar scroll-bar-bottom"></div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-coin"><i class="fa-solid fa-yin-yang"></i></div>
  <div class="loading-text">卦象推演中…</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 周易卦象 · 考试专题数据库
// ============================================================

    oracle: '谦，亨，君子有终。',

    score: 90,

  },
  {
    id: 5,

    sub: '国泰民安',

    score: 80,

  {

// ============================================================
// 核心算法：基于种子生成6爻
// ============================================================
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash);
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

function generateYao(subject, dateStr) {
  const seedStr = (dateStr || '') + '-' + subject + '-exam-fortune-2025';
  const seed = hashCode(seedStr);
  const rng = seededRandom(seed);
  const yao = [];
  for (let i = 0; i < 6; i++) {
    // 传统用三枚硬币：正=3, 反=2
    const coin1 = rng() > 0.5 ? 3 : 2;
    const coin2 = rng() > 0.5 ? 3 : 2;
    const coin3 = rng() > 0.5 ? 3 : 2;
    const total = coin1 + coin2 + coin3;
    // 6=老阴(变爻), 7=少阳, 8=少阴, 9=老阳(变爻)
    // 简化：奇数=阳(1), 偶数=阴(0)
    yao.push(total % 2 === 1 ? 1 : 0);
  }
  return yao;
}

function findHexagram(yao) {
  // Find exact match
  for (const h of HEXAGRAMS) {
    if (JSON.stringify(h.yaoPattern) === JSON.stringify(yao)) {
      return h;
    }
  }
  // Fallback: find closest match by hamming distance
  let best = HEXAGRAMS[0];
  let bestDist = 7;
  for (const h of HEXAGRAMS) {
    let dist = 0;
    for (let i = 0; i < 6; i++) {
      if (h.yaoPattern[i] !== yao[i]) dist++;
    }
    if (dist < bestDist) {
      bestDist = dist;
      best = h;
    }
  }
  return best;
}

function scoreColor(score) {
  if (score >= 90) return '#B22222';
  if (score >= 80) return '#C9A84C';
  if (score >= 70) return '#8B6914';
  return '#666';
}

// ============================================================
// 渲染
// ============================================================
function renderYaoLines(yao) {
  const container = document.getElementById('yaoContainer');
  container.innerHTML = '';
  const labels = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
  for (let i = 0; i < 6; i++) {
    const div = document.createElement('div');
    div.className = 'yao-line';
    const label = document.createElement('span');
    label.className = 'yao-label';
    label.textContent = labels[i];
    const line = document.createElement('span');
    line.className = 'line';
    if (yao[i] === 1) {
      line.classList.add('line-solid');
    } else {
      line.classList.add('line-broken');
    }
    div.appendChild(label);
    div.appendChild(line);
    container.appendChild(div);
  }
}

function renderResult(hexagram) {
  document.getElementById('hexagramSymbol').textContent = hexagram.symbol;
  document.getElementById('hexagramName').textContent = `${hexagram.name} · ${hexagram.sub}`;
  document.getElementById('hexagramSub').textContent = `第${hexagram.id}卦`;
  document.getElementById('oracleText').textContent = hexagram.oracle;
  
  const score = hexagram.score;
  document.getElementById('scoreNumber').textContent = score;
  document.getElementById('scoreNumber').style.color = scoreColor(score);
  
  const barFill = document.getElementById('scoreBarFill');
  barFill.style.width = '0%';
  barFill.style.background = `linear-gradient(90deg, ${scoreColor(score)}, ${scoreColor(Math.min(score + 10, 100))})`;
  
  setTimeout(() => {
    barFill.style.width = score + '%';
  }, 100);
  
  document.getElementById('interpretationText').textContent = hexagram.interpretation;
  document.getElementById('adviceText').textContent = hexagram.advice;
  
  renderYaoLines(hexagram.yaoPattern);
}

// ============================================================
// 分享功能
// ============================================================
function getShareText(hexagram, subject, date, name) {
  let text = `📚 【考试运程预测】\n`;
  if (name) text += `考生：${name}\n`;
  text += `科目：${subject}\n`;
  if (date) text += `日期：${date}\n`;
  text += `\n🔮 卦象：${hexagram.name} · ${hexagram.sub}\n`;
  text += `📜 卦辞：${hexagram.oracle}\n`;
  text += `⭐ 吉凶指数：${hexagram.score}/100\n`;
  text += `\n💡 ${hexagram.advice}\n`;
  text += `\n— 密心(Meseeing) · knowledge-juice`;
  return text;
}

// ============================================================
// 事件绑定
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  // Set default date to today
  const dateInput = document.getElementById('examDate');
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  dateInput.value = `${y}-${m}-${d}`;

  const form = document.getElementById('fortuneForm');
  const resultArea = document.getElementById('resultArea');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const divineBtn = document.getElementById('divineBtn');
  const toast = document.getElementById('toast');
  
  let currentHexagram = null;
  let currentSubject = '';
  let currentDate = '';
  let currentName = '';

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const subject = document.getElementById('subject').value.trim();
    if (!subject) {
      showToast('⚠️ 请填写考试科目');
      return;
    }
    
    const examDate = document.getElementById('examDate').value;
    const userName = document.getElementById('userName').value.trim();
    
    currentSubject = subject;
    currentDate = examDate;
    currentName = userName;
    
    // Start divination
    divineBtn.disabled = true;
    resultArea.classList.remove('visible');
    resultArea.style.display = 'none';
    loadingOverlay.classList.add('active');
    divineBtn.classList.add('shaking');
    
    // Simulate coin tossing animation
    setTimeout(function() {
      const yao = generateYao(subject, examDate);
      const hexagram = findHexagram(yao);
      currentHexagram = hexagram;
      
      // Render result
      renderResult(hexagram);
      
      // Show result
      loadingOverlay.classList.remove('active');
      resultArea.style.display = 'block';
      setTimeout(() => {
        resultArea.classList.add('visible');
      }, 50);
      
      divineBtn.disabled = false;
      divineBtn.classList.remove('shaking');
      
      // Scroll to result
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 2000 + Math.random() * 1000);
  });

  // Copy link/share text
  document.getElementById('copyLinkBtn').addEventListener('click', function() {
    if (!currentHexagram) {
      showToast('⚠️ 请先起卦');
      return;
    }
    const text = getShareText(currentHexagram, currentSubject, currentDate, currentName);
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ 结果已复制，快去分享吧！');
    }).catch(() => {
      // Fallback
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('✅ 结果已复制，快去分享吧！');
    });
  });

  // Screenshot (use html2canvas-like approach, but we'll just do a full page capture instruction)
  document.getElementById('screenshotBtn').addEventListener('click', function() {
    showToast('📸 截图已保存（使用系统截图：Cmd+Shift+4）');
    // On mobile we can't do much, but on desktop we instruct
  });

  // Toast function
  let toastTimeout;
  function showToast(msg) {
    clearTimeout(toastTimeout);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }
});
</script>
